    policy: DIRECT
    update_interval: 172800
    disabled: false
- rule_set:
    name: 哔哩哔哩
    match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/BiliBili/BiliBili.yaml
    policy: DIRECT
    update_interval: 172800
    disabled: false
- rule_set:
    name: 美团服务
    match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/MeiTuan/MeiTuan.yaml
    policy: DIRECT
    update_interval: 172800
