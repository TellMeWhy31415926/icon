    match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Google/Google.yaml
    policy: Google
    update_interval: 172800
- rule_set:
    name: 围墙GFW
    match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Proxy/Proxy_All_No_Resolve.yaml
    policy: GFW
    update_interval: 172800
- rule_set:
    name: 中国Domain
    match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/China/China_All_No_Resolve.yaml
    policy: DIRECT
    update_interval: 172800
- rule_set:
    name: 中国ASN
    match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/ChinaASN/ChinaASN.yaml
    policy: DIRECT
    update_interval: 172800
- ip_cidr:
    match: 10.0.0.0/8
    policy: DIRECT
- ip_cidr:
    match: 100.64.0.0/10
    policy: DIRECT
- ip_cidr:
    match: 127.0.0.0/8
    policy: DIRECT
- ip_cidr:
    match: 169.254.0.0/16
    policy: DIRECT
- ip_cidr:
    match: 172.16.0.0/12
    policy: DIRECT
- ip_cidr:
    match: 192.168.0.0/16
    policy: DIRECT
- ip_cidr:
    match: 224.0.0.0/4
    policy: DIRECT
- ip_cidr6:
    match: ::1/128
    policy: DIRECT
- ip_cidr6:
    match: fe80::/10
    policy: DIRECT
- ip_cidr6:
    match: fc00::/7
    policy: DIRECT
- ip_cidr6:
    match: ff00::/8
    policy: DIRECT
- ip_cidr6:
    match: 2408::/20
    policy: DIRECT
- ip_cidr6:
    match: 2409::/32
